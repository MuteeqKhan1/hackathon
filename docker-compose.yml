services:
  postgres:
    image: postgres:16-alpine
    container_name: alp-postgres
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: alp
      POSTGRES_PASSWORD: alp
    ports:
      - "5432:5432"
    volumes:
      - alp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alp -d learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: alp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: alp
      RABBITMQ_DEFAULT_PASS: alp
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: alp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alpminio
      MINIO_ROOT_PASSWORD: alpminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: alp-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 alpminio alpminio123;
      mc mb -p local/learning-platform-sources || true;
      exit 0;
      "

volumes:
  alp_pg_data:
  alp_minio_data:
