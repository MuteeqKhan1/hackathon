spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:learning_platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  cors:
    allowed-origins: http://localhost:5173
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test
    region: us-east-1
    local-base-path: ./data/storage-test
    max-file-bytes: 1048576
  auth:
    mock-enabled: true

logging:
  level:
    com.learningplatform: DEBUG
