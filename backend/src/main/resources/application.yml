spring:
  application:
    name: learning-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/learning_platform
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: alp
    password: alp
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    rabbit:
      enabled: false
    db:
      enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  storage:
    endpoint: http://localhost:9000
    access-key: alpminio
    secret-key: alpminio123
    bucket: learning-platform-sources
    region: us-east-1
    local-base-path: ./data/storage
    max-file-bytes: 52428800
  auth:
    mock-enabled: true
  ai:
    # heuristic = local grounded stub (default); openai = real adapter (requires implementation + key)
    provider: heuristic
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      base-url: https://api.openai.com/v1

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level correlationId=%X{correlationId} %logger{36} - %msg%n"
  level:
    root: INFO
    com.learningplatform: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
